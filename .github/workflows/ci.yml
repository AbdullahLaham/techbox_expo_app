name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Known findings from the React Hooks rules (useRef(new Animated.Value()).current
      # and a few others in older screens) are reported but do not fail the build yet.
      # Remove continue-on-error once `npx expo lint` is clean.
      - name: Lint
        run: npx expo lint
        continue-on-error: true
